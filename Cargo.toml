[package]
name = "triplify"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Triplify turns any tabular data dump (CSV, XLSX, Parquet, ...) into raw RDF using the EKGF Raw Data Ontology, with DCAT, PROV and git provenance, without any mapping"
authors = ["Jacobus Geluk <jacobus.geluk@ekgf.org>"]
license = "MIT"
repository = "https://github.com/EKGF/triplify"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
anyhow = "1"
arrow-array = "60.1"
arrow-cast = "60.1"
arrow-schema = "60.1"
async-compression = { version = "0.4.52", features = ["tokio", "gzip"] }
calamine = { version = "0.38", features = ["dates"] }
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3", features = ["tracing"] }
csv-async = { version = "1.3", features = ["tokio"] }
flume = "0.12.0"
futures = "0.3"
gix = { version = "0.90", default-features = false, features = ["sha1", "revision"] }
gzp = { version = "2.0.4", default-features = false, features = ["deflate_zlib"] }
hex = "0.4"
ignore = "0.4.34"
itoa = "1.0.19"
oxrdf = { version = "0.3.5", features = ["rdfc-10"] }
oxrdfio = { version = "0.2.7", features = ["async-tokio"] }
parquet = { version = "60.1", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2", "flate2-rust_backend", "brotli"] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.29.3", features = ["v7", "v8"] }

[dev-dependencies]
arrow-array = "60.1"
flate2 = "1.1.11"
parquet = { version = "60.1", default-features = false, features = ["arrow"] }
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
tempfile = "3"
