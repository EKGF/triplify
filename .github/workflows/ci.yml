name: CI
on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --lib -- -D warnings
      - run: cargo clippy --locked --bins -- -D warnings
      - run: cargo clippy --locked --tests -- -D warnings
      - run: cargo test --locked --lib
      - run: cargo test --locked --tests

  s3:
    name: test s3 (LocalStack)
    runs-on: ubuntu-latest
    env:
      TRIPLIFY_TEST_S3: "1"
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - name: Start LocalStack S3
        shell: bash
        run: |
          # 4.4 is the last community image that runs without a license.
          docker run -d --name s3 -p 4566:4566 -e SERVICES=s3 localstack/localstack:4.4 || exit $?
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs s3
          printf 'LocalStack did not become healthy\n' >&2
          exit 1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test s3

  wheels:
    name: wheel ${{ matrix.target }}
    # Pull requests only run the tests; main, tags and manual runs build wheels.
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04,     manylinux: "2_28" }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, manylinux: "2_28" }
          - { target: aarch64-apple-darwin,      runner: macos-15,         manylinux: "off" }
          - { target: x86_64-pc-windows-msvc,    runner: windows-latest,   manylinux: "off" }
          - { target: aarch64-pc-windows-msvc,   runner: windows-11-arm,   manylinux: "off" }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: nightly-2026-10-30
          args: --release --locked --strip --out dist
      - name: Smoke-test the installed command
        shell: bash
        run: |
          python -m venv .smoke || exit $?
          if [[ -x .smoke/bin/python ]]; then py=.smoke/bin/python; bin=.smoke/bin; else py=.smoke/Scripts/python.exe; bin=.smoke/Scripts; fi
          "$py" -m pip install --no-index --find-links dist triplify || exit $?
          printf 'a,b\n1,00123\n' > smoke.csv || exit $?
          "$bin/triplify" --version || exit $?
          "$bin/triplify" smoke.csv -o smoke.nq || exit $?
          grep -q '"00123"' smoke.nq || { printf 'smoke output lacks the CSV value\n' >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
      - name: Package the binary for cargo-binstall
        shell: bash
        run: |
          if [[ -x .smoke/bin/triplify ]]; then exe=.smoke/bin/triplify; else exe=.smoke/Scripts/triplify.exe; fi
          mkdir -p bin && cp "$exe" bin/ || exit $?
          cd bin || exit $?
          if [[ "$exe" == *.exe ]]; then 7z a -bd "../triplify-${{ matrix.target }}.zip" triplify.exe >/dev/null || exit $?
          else zip -q "../triplify-${{ matrix.target }}.zip" triplify || exit $?; fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: triplify-${{ matrix.target }}.zip

  sdist:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    # PyPI trusted publisher: EKGF/triplify, workflow ci.yml, environment pypi.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    # Release assets named as [package.metadata.binstall] expects them.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: binary-*
          merge-multiple: true
      - name: Render the Homebrew formula
        # EKGF/homebrew-tap copies triplify.rb from the latest release.
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          sha() { sha256sum "assets/triplify-$1.zip" | cut -d' ' -f1; }
          darwin_arm=$(sha aarch64-apple-darwin) || exit $?
          linux_arm=$(sha aarch64-unknown-linux-gnu) || exit $?
          linux_x86=$(sha x86_64-unknown-linux-gnu) || exit $?
          cat > assets/triplify.rb <<RUBY || exit $?
          class Triplify < Formula
            desc "Turn CSV, spreadsheets and Parquet into raw RDF without mapping"
            homepage "https://ekgf.github.io/triplify/"
            license "MIT"

            on_macos do
              depends_on arch: :arm64
              on_arm do
                url "$base/triplify-aarch64-apple-darwin.zip"
                sha256 "$darwin_arm"
              end
            end

            on_linux do
              on_arm do
                url "$base/triplify-aarch64-unknown-linux-gnu.zip"
                sha256 "$linux_arm"
              end
              on_intel do
                url "$base/triplify-x86_64-unknown-linux-gnu.zip"
                sha256 "$linux_x86"
              end
            end

            def install
              bin.install "triplify"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/triplify --version")
            end
          end
          RUBY
          sed -i 's/^          //' assets/triplify.rb || exit $?
          printf 'rendered triplify.rb for %s\n' "$version"
      - name: Create the release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/*.zip assets/triplify.rb \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes || exit $?

  publish-crates:
    # crates.io trusted publisher: EKGF/triplify, workflow ci.yml, environment crates-io.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, github-release]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-30
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
